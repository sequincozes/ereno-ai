  <path class="edge" d="M 1282 162 L 1282 292 L 92.0 292 L 92.0 257"/>
  <polygon class="head" points="87.0,257 92.0,250 97.0,257"/>
  <path class="edge" d="M 1124.0 292 L 1124.0 257"/>
  <polygon class="head" points="1119.0,257 1124.0,250 1129.0,257"/>
  <text class="gate" x="1200.0" y="268" text-anchor="middle">optional retraining</text>
  <text class="gate" x="1200.0" y="285" text-anchor="middle">on found variants</text>
  <rect x="330" y="275" width="520" height="34" rx="9" fill="#1a1a1a"/>
  <text class="artifact" x="590.0" y="297">Operational: metrics → deterministic feedback policy → next intent</text>
  <path class="edge" stroke-dasharray="7 5" d="M 1410.0 250 L 1410.0 348 L 48.0 348 L 48.0 257"/>
  <polygon class="head" points="43.0,257 48.0,250 53.0,257"/>
  <rect x="422.0" y="331" width="640" height="34" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="gate" x="742.0" y="353">Advisory: DefensePlan, validated and recorded, never applied automatically</text>
</svg>
