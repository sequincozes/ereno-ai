  <text class="item" x="682.0" y="128.0">None</text>
  <rect class="inner" x="624" y="142" width="116" height="26" fill="#ffffff" stroke="#1a6135"/>
  <text class="item" x="682.0" y="160.0">Random</text>
  <rect class="inner" x="624" y="174" width="116" height="26" fill="#ffffff" stroke="#1a6135"/>
  <text class="item" x="682.0" y="192.0">Ratio</text>
  <rect class="inner" x="624" y="206" width="116" height="26" fill="#bfe6cc" stroke="#1a6135"/>
  <text class="item" x="682.0" y="224.0">…</text>
  <rect class="inner" x="758" y="80" width="136" height="160" fill="#d6f0de" stroke="#1a6135"/>
  <text class="item" x="826" y="101" font-weight="700">Selection</text>
  <rect class="inner" x="768" y="110" width="116" height="26" fill="#ffffff" stroke="#1a6135"/>
  <text class="item" x="826.0" y="128.0">None</text>
  <rect class="inner" x="768" y="142" width="116" height="26" fill="#ffffff" stroke="#1a6135"/>
  <text class="item" x="826.0" y="160.0">Filter (MI)</text>
  <rect class="inner" x="768" y="174" width="116" height="26" fill="#ffffff" stroke="#1a6135"/>
  <text class="item" x="826.0" y="192.0">Wrapper (RFE)</text>
  <rect class="inner" x="768" y="206" width="116" height="26" fill="#bfe6cc" stroke="#1a6135"/>
  <text class="item" x="826.0" y="224.0">…</text>
  <line class="edge" x1="904" y1="145" x2="917" y2="145"/>
  <polygon class="head" points="917,140 924,145 917,150"/>
  <rect x="924" y="128" width="88" height="34" rx="9" fill="#1a1a1a"/>
  <text class="artifact" x="968.0" y="150.0">Features</text>
  <line class="edge" x1="1012" y1="145" x2="1025" y2="145"/>
  <polygon class="head" points="1025,140 1032,145 1025,150"/>
  <rect class="agent" x="1032" y="40" width="184" height="210" fill="#8c6bc8" stroke="#5c3f95"/>
