<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1484 372" width="1484" height="372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>ERENO-AI — architecture</title>
  <desc>Injector agent, generator, pre-processor, detector and defender agent in series. Solid: the operational path (metrics, deterministic feedback policy, and optional retraining on the variants found). Dashed: the advisory path (the defense plan is gated and recorded, never applied). Only the two agents call an LLM.</desc>
  <defs>
    <style>
      .agent      { rx: 14; ry: 14; stroke-width: 3; }
      .inner      { rx: 8;  ry: 8;  stroke-width: 1.5; }
      .agent-name { font-size: 19px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .item       { font-size: 15px; fill: #1a1a1a; text-anchor: middle; }
      .artifact   { font-size: 15px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .edge       { stroke: #1a1a1a; stroke-width: 2; fill: none; }
      .head       { fill: #1a1a1a; stroke: none; }
      .gate       { font-size: 15px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .llm        { font-size: 15px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1484" height="372" fill="#ffffff"/>
  <rect x="60.0" y="6" width="64" height="26" rx="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text class="llm" x="92.0" y="25">LLM</text>
  <rect class="agent" x="12" y="40" width="160" height="210" fill="#e8463c" stroke="#b5241c"/>
  <text class="agent-name" x="92.0" y="70">Injector</text>
  <rect class="inner" x="24" y="84" width="136" height="34" fill="#fbd9d6" stroke="#b5241c"/>
  <text class="item" x="92.0" y="106.0">Intent-driven</text>
  <rect class="inner" x="24" y="126" width="136" height="34" fill="#fbd9d6" stroke="#b5241c"/>
  <text class="item" x="92.0" y="148.0">Model-driven</text>
  <rect class="inner" x="24" y="168" width="136" height="34" fill="#fbd9d6" stroke="#b5241c"/>
  <text class="item" x="92.0" y="190.0">Data-driven</text>
  <rect class="inner" x="24" y="210" width="136" height="28" fill="#f6b4ae" stroke="#b5241c"/>
  <text class="item" x="92.0" y="229.0">…</text>
  <line class="edge" x1="172" y1="145" x2="185" y2="145"/>
  <polygon class="head" points="185,140 192,145 185,150"/>
  <rect x="192" y="128" width="104" height="34" rx="9" fill="#1a1a1a"/>
  <text class="artifact" x="244.0" y="150.0">IntentSpec</text>
  <text class="gate" x="244" y="185">compiler +</text>
  <text class="gate" x="244" y="202">catalog gate</text>
  <line class="edge" x1="296" y1="145" x2="309" y2="145"/>
  <polygon class="head" points="309,140 316,145 309,150"/>
  <rect class="agent" x="316" y="40" width="176" height="210" fill="#1f6fc4" stroke="#124a87"/>
  <text class="agent-name" x="404.0" y="70">Generator</text>
  <rect class="inner" x="328" y="84" width="152" height="34" fill="#cfe3f7" stroke="#124a87"/>
  <text class="item" x="404.0" y="106.0">ERENO (jar)</text>
  <rect class="inner" x="328" y="126" width="152" height="34" fill="#cfe3f7" stroke="#124a87"/>
  <text class="item" x="404.0" y="148.0">Cached replay</text>
  <rect class="inner" x="328" y="168" width="152" height="34" fill="#e7eef6" stroke="#8fa9c4" stroke-dasharray="5 4"/>
  <text class="item" x="404.0" y="190.0" fill="#5c6b7a">Mininet</text>
  <rect class="inner" x="328" y="210" width="152" height="28" fill="#aecdee" stroke="#124a87"/>
  <text class="item" x="404.0" y="229.0">…</text>
