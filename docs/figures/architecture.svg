  <rect class="inner" x="1044" y="84" width="160" height="32" fill="#e6ddf5" stroke="#5c3f95"/>
  <text class="item" x="1124.0" y="105.0">Random Forest</text>
  <rect class="inner" x="1044" y="124" width="160" height="32" fill="#e6ddf5" stroke="#5c3f95"/>
  <text class="item" x="1124.0" y="145.0">XGBoost</text>
  <rect class="inner" x="1044" y="164" width="160" height="32" fill="#e6ddf5" stroke="#5c3f95"/>
  <text class="item" x="1124.0" y="185.0">SVM (linear/RBF)</text>
  <rect class="inner" x="1044" y="204" width="160" height="32" fill="#e6ddf5" stroke="#5c3f95"/>
  <text class="item" x="1124.0" y="225.0">Decision Tree</text>
  <line class="edge" x1="1216" y1="145" x2="1229" y2="145"/>
  <polygon class="head" points="1229,140 1236,145 1229,150"/>
  <rect x="1236" y="128" width="92" height="34" rx="9" fill="#1a1a1a"/>
  <text class="artifact" x="1282.0" y="142.0">Detection</text>
  <text class="artifact" x="1282.0" y="158.0">Report</text>
  <line class="edge" x1="1328" y1="145" x2="1341" y2="145"/>
  <polygon class="head" points="1341,140 1348,145 1341,150"/>
  <rect x="1378.0" y="6" width="64" height="26" rx="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text class="llm" x="1410.0" y="25">LLM</text>
  <rect class="agent" x="1348" y="40" width="124" height="210" fill="#e08c18" stroke="#9c5f05"/>
  <text class="agent-name" x="1410.0" y="70">Defender</text>
  <rect class="inner" x="1358" y="82" width="104" height="48" fill="#fbe6c4" stroke="#9c5f05"/>
  <text class="item" x="1410.0" y="102.0">Evidence</text>
  <text class="item" x="1410.0" y="120.0">gate</text>
  <rect class="inner" x="1358" y="136" width="104" height="48" fill="#fbe6c4" stroke="#9c5f05"/>
  <text class="item" x="1410.0" y="156.0">IEC 61850</text>
  <text class="item" x="1410.0" y="174.0">playbooks</text>
  <rect class="inner" x="1358" y="190" width="104" height="48" fill="#fbe6c4" stroke="#9c5f05"/>
  <text class="item" x="1410.0" y="210.0">Rule</text>
